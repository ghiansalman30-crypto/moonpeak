name: moonpeak-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run validate
      - name: Package contents
        run: npm pack --dry-run -w packages/moonpeak
      - name: Scaffold from the packed tarball
        run: |
          npm pack -w packages/moonpeak --pack-destination "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          node "$GITHUB_WORKSPACE/packages/moonpeak/bin/moonpeak.mjs" new ci-app calendar,review
          cd ci-app
          npm pkg set dependencies.moonpeak="file:$RUNNER_TEMP/$(ls "$RUNNER_TEMP" | grep '^moonpeak-.*\.tgz$')"
          npm install --no-audit --no-fund
          npx moonpeak test
          npx tsc --noEmit -p .
          npx moonpeak build
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: examples/*/test-results
          retention-days: 7
